<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monmouth University - Attendance Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #002855 0%, #004080 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #002855;
            font-size: 32px;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tab {
            background: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .tab.active {
            background: #002855;
            color: white;
        }

        .tab:hover {
            transform: translateY(-2px);
        }

        .content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: none;
        }

        .content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #002855;
        }

        .btn {
            background: #002855;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #004080;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
        }

        .class-list, .student-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .class-card, .student-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }

        .class-card:hover, .student-card:hover {
            border-color: #002855;
            transform: translateY(-2px);
        }

        .class-card h3, .student-card h3 {
            color: #002855;
            margin-bottom: 10px;
        }

        .class-card p, .student-card p {
            color: #666;
            margin-bottom: 5px;
        }

        .card-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .attendance-grid {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: #002855;
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .status-btn {
            padding: 6px 12px;
            border: 2px solid;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .status-present {
            border-color: #28a745;
            color: #28a745;
            background: white;
        }

        .status-present.active {
            background: #28a745;
            color: white;
        }

        .status-absent {
            border-color: #dc3545;
            color: #dc3545;
            background: white;
        }

        .status-absent.active {
            background: #dc3545;
            color: white;
        }

        .status-late {
            border-color: #ffc107;
            color: #ffc107;
            background: white;
        }

        .status-late.active {
            background: #ffc107;
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #002855;
        }

        .stat-card h4 {
            color: #002855;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #002855;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            background: #28a745;
            height: 100%;
            transition: width 0.3s;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #002855;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            color: #002855;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Attendance Tracker</h1>
            <p>Monmouth University - Professor's Dashboard</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('classes')">My Classes</button>
            <button class="tab" onclick="showTab('students')">Students</button>
            <button class="tab" onclick="showTab('attendance')">Take Attendance</button>
            <button class="tab" onclick="showTab('stats')">Statistics</button>
        </div>

        <!-- Classes Tab -->
        <div id="classes" class="content active">
            <h2 style="color: #002855; margin-bottom: 20px;">Manage Classes</h2>
            <button class="btn" onclick="showModal('addClass')">+ Add New Class</button>
            <div id="classList" class="class-list"></div>
        </div>

        <!-- Students Tab -->
        <div id="students" class="content">
            <h2 style="color: #002855; margin-bottom: 20px;">Manage Students</h2>
            <div class="form-group">
                <label>Select Class:</label>
                <select id="studentClassSelect" onchange="loadStudents()">
                    <option value="">-- Select a class --</option>
                </select>
            </div>
            <button class="btn" onclick="showModal('addStudent')" id="addStudentBtn" disabled>+ Add Student</button>
            <div id="studentList" class="student-list"></div>
        </div>

        <!-- Attendance Tab -->
        <div id="attendance" class="content">
            <h2 style="color: #002855; margin-bottom: 20px;">Take Attendance</h2>
            <div class="form-group">
                <label>Select Class:</label>
                <select id="attendanceClassSelect" onchange="loadAttendanceView()">
                    <option value="">-- Select a class --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Date:</label>
                <input type="date" id="attendanceDate" value="">
            </div>
            <button class="btn" onclick="saveAttendance()" id="saveAttendanceBtn" disabled>Save Attendance</button>
            <div id="attendanceGrid" class="attendance-grid"></div>
        </div>

        <!-- Stats Tab -->
        <div id="stats" class="content">
            <h2 style="color: #002855; margin-bottom: 20px;">Attendance Statistics</h2>
            <div class="form-group">
                <label>Select Class:</label>
                <select id="statsClassSelect" onchange="loadStats()">
                    <option value="">-- Select a class --</option>
                </select>
            </div>
            <div id="statsGrid" class="stats-grid"></div>
        </div>
    </div>

    <!-- Add Class Modal -->
    <div id="addClassModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Class</h2>
                <button class="close-btn" onclick="closeModal('addClass')">&times;</button>
            </div>
            <div class="form-group">
                <label>Course Code:</label>
                <input type="text" id="courseCode" placeholder="e.g., CS-101">
            </div>
            <div class="form-group">
                <label>Course Name:</label>
                <input type="text" id="courseName" placeholder="e.g., Introduction to Computer Science">
            </div>
            <div class="form-group">
                <label>Semester:</label>
                <input type="text" id="semester" placeholder="e.g., Fall 2025">
            </div>
            <div class="form-group">
                <label>Schedule:</label>
                <input type="text" id="schedule" placeholder="e.g., MWF 10:00-11:15 AM">
            </div>
            <div class="form-group">
                <label>Room:</label>
                <input type="text" id="room" placeholder="e.g., Howard Hall 204">
            </div>
            <button class="btn" onclick="addClass()">Add Class</button>
        </div>
    </div>

    <!-- Add Student Modal -->
    <div id="addStudentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Student</h2>
                <button class="close-btn" onclick="closeModal('addStudent')">&times;</button>
            </div>
            <div class="form-group">
                <label>Student ID:</label>
                <input type="text" id="studentId" placeholder="e.g., 900123456">
            </div>
            <div class="form-group">
                <label>First Name:</label>
                <input type="text" id="firstName">
            </div>
            <div class="form-group">
                <label>Last Name:</label>
                <input type="text" id="lastName">
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" placeholder="s0123456@monmouth.edu">
            </div>
            <button class="btn" onclick="addStudent()">Add Student</button>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        let currentClass = null;
        let attendanceRecords = {};

        // Set today's date as default
        document.getElementById('attendanceDate').valueAsDate = new Date();

        // Tab switching
        function showTab(tabNameOrEvent) {
            const tabs = Array.from(document.querySelectorAll('.tab'));
            const contents = Array.from(document.querySelectorAll('.content'));

            // clear current active states
            tabs.forEach(t => t.classList.remove('active'));
            contents.forEach(c => c.classList.remove('active'));

            // decide which tab to activate
            let tabIndex = -1;
            if (typeof tabNameOrEvent === 'string') {
                const nameToIndex = { classes: 0, students: 1, attendance: 2, stats: 3 };
                tabIndex = nameToIndex[tabNameOrEvent];
                if (tabIndex !== undefined && tabIndex >= 0) {
                    tabs[tabIndex].classList.add('active');
                    contents[tabIndex].classList.add('active');
                }
            } else if (tabNameOrEvent && tabNameOrEvent.target) {
                // called with an event-like object or a button element wrapped as { target: btn }
                const btn = tabNameOrEvent.target;
                tabIndex = tabs.indexOf(btn);
                if (tabIndex >= 0) {
                    btn.classList.add('active');
                    contents[tabIndex].classList.add('active');
                }
            } else if (tabNameOrEvent && tabNameOrEvent.nodeType === 1) {
                // direct element passed
                const btn = tabNameOrEvent;
                tabIndex = tabs.indexOf(btn);
                if (tabIndex >= 0) {
                    btn.classList.add('active');
                    contents[tabIndex].classList.add('active');
                }
            }

            // load selects for tabs that need it
            if (tabIndex >= 1) { // students (1), attendance (2), stats (3)
                loadClassSelects();
            }
        }

        // Modal functions
        function showModal(modalName) {
            document.getElementById(modalName + 'Modal').classList.add('active');
        }

        function closeModal(modalName) {
            document.getElementById(modalName + 'Modal').classList.remove('active');
        }

        // Load classes
        async function loadClasses() {
            try {
                const response = await fetch(`${API_URL}/classes`);
                const classes = await response.json();
                
                const classList = document.getElementById('classList');
                
                if (classes.length === 0) {
                    classList.innerHTML = '<div class="empty-state"><h3>No Classes Yet</h3><p>Click "Add New Class" to get started</p></div>';
                    return;
                }
                
                classList.innerHTML = classes.map(c => `
                    <div class="class-card">
                        <h3>${c.course_code}: ${c.course_name}</h3>
                        <p><strong>Semester:</strong> ${c.semester}</p>
                        <p><strong>Schedule:</strong> ${c.schedule}</p>
                        <p><strong>Room:</strong> ${c.room}</p>
                        <div class="card-actions">
                            <button class="btn btn-small" onclick="selectClass('${c.id}')">View Students</button>
                            <button class="btn btn-danger btn-small" onclick="deleteClass('${c.id}')">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading classes:', error);
            }
        }

        // Add class
        async function addClass() {
            const classData = {
                course_code: document.getElementById('courseCode').value,
                course_name: document.getElementById('courseName').value,
                semester: document.getElementById('semester').value,
                schedule: document.getElementById('schedule').value,
                room: document.getElementById('room').value
            };

            if (!classData.course_code || !classData.course_name || !classData.semester) {
                alert('Please fill in all required fields');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/classes`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(classData)
                });
                
                if (response.ok) {
                    closeModal('addClass');
                    loadClasses();
                    document.getElementById('courseCode').value = '';
                    document.getElementById('courseName').value = '';
                    document.getElementById('semester').value = '';
                    document.getElementById('schedule').value = '';
                    document.getElementById('room').value = '';
                }
            } catch (error) {
                console.error('Error adding class:', error);
            }
        }

        // Delete class
        async function deleteClass(classId) {
            if (!confirm('Are you sure you want to delete this class? All students and attendance records will be removed.')) {
                return;
            }

            try {
                await fetch(`${API_URL}/classes/${classId}`, {method: 'DELETE'});
                loadClasses();
            } catch (error) {
                console.error('Error deleting class:', error);
            }
        }

        // Load class selects
        async function loadClassSelects() {
            try {
                const response = await fetch(`${API_URL}/classes`);
                const classes = await response.json();

                ['studentClassSelect', 'attendanceClassSelect', 'statsClassSelect'].forEach(selectId => {
                    const select = document.getElementById(selectId);
                    select.innerHTML = '<option value="">-- Select a class --</option>' + 
                        classes.map(c => `<option value="${c.id}">${c.course_code}: ${c.course_name} (${c.semester})</option>`).join('');
                    // ensure no class is pre-selected
                    select.value = '';
                });

                // when no class selected, clear dependent views and disable buttons
                document.getElementById('studentList').innerHTML = '';
                document.getElementById('attendanceGrid').innerHTML = '';
                document.getElementById('statsGrid').innerHTML = '';
                document.getElementById('addStudentBtn').disabled = true;
                document.getElementById('saveAttendanceBtn').disabled = true;
            } catch (error) {
                console.error('Error loading class selects:', error);
            }
        }

        // Select class
        function selectClass(classId) {
            document.getElementById('studentClassSelect').value = classId;
            // use named tab switch to avoid relying on event.target (which can be undefined when called programmatically)
            showTab('students');
            loadStudents();
        }

        // Load students
        async function loadStudents() {
            const classId = document.getElementById('studentClassSelect').value;
            if (!classId) {
                document.getElementById('studentList').innerHTML = '';
                document.getElementById('addStudentBtn').disabled = true;
                return;
            }

            document.getElementById('addStudentBtn').disabled = false;
            currentClass = classId;

            try {
                const response = await fetch(`${API_URL}/classes/${classId}/students`);
                const students = await response.json();
                
                const studentList = document.getElementById('studentList');
                
                if (students.length === 0) {
                    studentList.innerHTML = '<div class="empty-state"><h3>No Students Yet</h3><p>Click "Add Student" to add students to this class</p></div>';
                    return;
                }
                
                studentList.innerHTML = students.map(s => `
                    <div class="student-card">
                        <h3>${s.first_name} ${s.last_name}</h3>
                        <p><strong>ID:</strong> ${s.student_id}</p>
                        <p><strong>Email:</strong> ${s.email}</p>
                        <div class="card-actions">
                            <button class="btn btn-danger btn-small" onclick="deleteStudent('${classId}', '${s.id}')">Remove</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading students:', error);
            }
        }

        // Add student
        async function addStudent() {
            const classId = document.getElementById('studentClassSelect').value;
            if (!classId) {
                alert('Please select a class first');
                return;
            }

            // gather values
            const studentIdVal = document.getElementById('studentId').value.trim();
            const firstNameVal = document.getElementById('firstName').value.trim();
            const lastNameVal = document.getElementById('lastName').value.trim();
            let emailVal = document.getElementById('email').value.trim();

            if (!studentIdVal || !firstNameVal || !lastNameVal) {
                alert('Please fill in all required fields');
                return;
            }

            // if email not provided, build from student id
            if (!emailVal) {
                if (studentIdVal.includes('@')) {
                    emailVal = studentIdVal;
                } else {
                    emailVal = `${studentIdVal}@monmouth.edu`;
                }
                document.getElementById('email').value = emailVal;
            }

            const studentData = {
                student_id: studentIdVal,
                first_name: firstNameVal,
                last_name: lastNameVal,
                email: emailVal
            };

            try {
                const response = await fetch(`${API_URL}/classes/${classId}/students`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(studentData)
                });
                
                if (response.ok) {
                    closeModal('addStudent');
                    // refresh students for the selected class
                    loadStudents();
                    // clear modal fields
                    document.getElementById('studentId').value = '';
                    document.getElementById('firstName').value = '';
                    document.getElementById('lastName').value = '';
                    document.getElementById('email').value = '';
                } else {
                    const err = await response.json().catch(() => null);
                    alert(err && err.error ? `Error adding student: ${err.error}` : 'Error adding student');
                }
            } catch (error) {
                console.error('Error adding student:', error);
                alert('Error adding student');
            }
        }

        // Delete student
        async function deleteStudent(classId, studentId) {
            if (!confirm('Are you sure you want to remove this student?')) {
                return;
            }

            try {
                await fetch(`${API_URL}/classes/${classId}/students/${studentId}`, {method: 'DELETE'});
                loadStudents();
            } catch (error) {
                console.error('Error deleting student:', error);
            }
        }

        // Load attendance view
        async function loadAttendanceView() {
            const classId = document.getElementById('attendanceClassSelect').value;
            if (!classId) {
                document.getElementById('attendanceGrid').innerHTML = '';
                document.getElementById('saveAttendanceBtn').disabled = true;
                return;
            }

            document.getElementById('saveAttendanceBtn').disabled = false;
            currentClass = classId;

            try {
                const response = await fetch(`${API_URL}/classes/${classId}/students`);
                const students = await response.json();
                
                if (students.length === 0) {
                    document.getElementById('attendanceGrid').innerHTML = '<div class="empty-state"><h3>No Students</h3><p>Add students to this class first</p></div>';
                    return;
                }

                const grid = document.getElementById('attendanceGrid');
                grid.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Student ID</th>
                                <th>Name</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${students.map(s => `
                                <tr>
                                    <td>${s.student_id}</td>
                                    <td>${s.first_name} ${s.last_name}</td>
                                    <td>
                                        <button class="status-btn status-present" onclick="setStatus('${s.id}', 'present')">Present</button>
                                        <button class="status-btn status-late" onclick="setStatus('${s.id}', 'late')">Late</button>
                                        <button class="status-btn status-absent active" onclick="setStatus('${s.id}', 'absent')">Absent</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;

                // Initialize all as absent
                attendanceRecords = {};
                students.forEach(s => {
                    attendanceRecords[s.id] = 'absent';
                });
            } catch (error) {
                console.error('Error loading attendance view:', error);
            }
        }

        // Set attendance status
        function setStatus(studentId, status) {
            attendanceRecords[studentId] = status;
            
            // Update button states
            const row = event.target.closest('tr');
            row.querySelectorAll('.status-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // Save attendance
        async function saveAttendance() {
            const classId = document.getElementById('attendanceClassSelect').value;
            const date = document.getElementById('attendanceDate').value;

            if (!date) {
                alert('Please select a date');
                return;
            }

            const records = Object.entries(attendanceRecords).map(([studentId, status]) => ({
                student_id: studentId,
                status: status
            }));

            try {
                const response = await fetch(`${API_URL}/classes/${classId}/attendance`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({date, records})
                });
                
                if (response.ok) {
                    alert('Attendance saved successfully!');
                }
            } catch (error) {
                console.error('Error saving attendance:', error);
                alert('Error saving attendance');
            }
        }

        // Load stats
        async function loadStats() {
            const classId = document.getElementById('statsClassSelect').value;
            if (!classId) {
                document.getElementById('statsGrid').innerHTML = '';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/classes/${classId}/stats`);
                const stats = await response.json();
                
                if (stats.length === 0) {
                    document.getElementById('statsGrid').innerHTML = '<div class="empty-state"><h3>No Data Yet</h3><p>Take attendance to see statistics</p></div>';
                    return;
                }

                const grid = document.getElementById('statsGrid');
                grid.innerHTML = stats.map(s => `
                    <div class="stat-card">
                        <h4>${s.student.first_name} ${s.student.last_name}</h4>
                        <div class="stat-value">${s.attendance_rate}%</div>
                        <div class="stat-label">Attendance Rate</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${s.attendance_rate}%"></div>
                        </div>
                        <p style="margin-top: 10px; font-size: 14px; color: #666;">
                            Present: ${s.present} | Late: ${s.late} | Absent: ${s.absent}
                        </p>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Initial load
        loadClasses();
    </script>
</body>
</html>
